<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f3f4f7">
  <meta name="description" content="Lokalna ewidencja godzin pracy, absencji i notatek.">
  <title>Czas pracy 1.0.0</title>
  <!-- Manifest i Service Worker zostaną dołączone w osobnym etapie. -->
  <style>
    /* 1–2. System wizualny */
    :root {
      color-scheme: light;
      --bg: #f3f4f7; --surface: #fff; --soft: #eef1f6; --ink: #171b24;
      --muted: #606878; --line: #e1e5ec; --blue: #1565d8; --blue-soft: #eaf2ff;
      --green: #246e45; --green-soft: #edf7ef; --purple: #775098; --purple-soft: #f2edf8;
      --red: #b43744; --red-soft: #fff0f1; --yellow: #826300; --yellow-soft: #fff8db;
      --radius: 24px; --small-radius: 14px; --pill-radius: 999px;
      --shadow: 0 3px 18px #22304b08; --gap: 16px; --space: 24px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --motion: 160ms; --viewport-height: 100dvh;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--font); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 1.25rem; letter-spacing: -.035em; }
    h2 { font-size: 1.15rem; letter-spacing: -.025em; }
    h3 { font-size: 1rem; }
    svg { width: 24px; height: 24px; flex: 0 0 auto; }
    :focus-visible { outline: 3px solid #1565d880; outline-offset: 3px; }
    /* 3. Wspólne komponenty */
    .app { max-width: 960px; margin: auto; padding: 0 max(12px, env(safe-area-inset-right)) 36px max(12px, env(safe-area-inset-left)); }
    .header { display: flex; align-items: center; gap: 12px; min-height: 72px; padding-top: env(safe-area-inset-top); }
    .header h1 { flex: 1; }
    .version { color: var(--muted); font-size: .72rem; }
    .icon-button { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: var(--soft); }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 48px; padding: 11px 20px; border: 0; border-radius: var(--pill-radius); background: var(--blue); color: white; font-weight: 650; text-align: center; }
    .button.secondary { background: var(--blue-soft); color: var(--blue); }
    .button.danger { background: var(--red-soft); color: var(--red); }
    .button:disabled { opacity: .5; cursor: default; }
    .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: var(--space); min-width: 0; }
    .stack { display: grid; gap: var(--gap); }
    .row { display: flex; gap: 12px; align-items: center; }
    .spread { justify-content: space-between; }
    .wrap { flex-wrap: wrap; }
    .muted { color: var(--muted); font-size: .9rem; }
    .eyebrow { color: var(--muted); font-size: .78rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .field { display: grid; gap: 7px; font-weight: 600; min-width: 0; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; min-height: 48px; padding: 12px; border: 1px solid var(--line); border-radius: var(--small-radius); background: var(--soft); color: var(--ink); font-weight: 400; }
    .field textarea { resize: vertical; min-height: 180px; }
    .field small { color: var(--muted); font-weight: 400; }
    .fields { display: grid; gap: 18px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
    .check input { width: 22px; height: 22px; accent-color: var(--blue); }
    .segment { display: flex; gap: 4px; padding: 4px; border-radius: var(--pill-radius); background: var(--soft); }
    .segment button { flex: 1; min-height: 44px; border: 0; border-radius: var(--pill-radius); background: transparent; padding: 8px 12px; font-weight: 600; }
    .segment button[aria-pressed="true"] { background: var(--surface); color: var(--blue); box-shadow: var(--shadow); }
    .pill { border: 0; border-radius: var(--pill-radius); padding: 10px 14px; min-height: 44px; background: var(--soft); font-size: .9rem; font-weight: 600; }
    .notice { padding: 16px; border-radius: var(--small-radius); background: var(--yellow-soft); color: var(--yellow); margin-bottom: 16px; overflow-wrap: anywhere; }
    .notice.error { background: var(--red-soft); color: var(--red); }
    .error-text { color: var(--red); margin: 12px 0; white-space: pre-line; overflow-wrap: anywhere; }
    .event { display: flex; width: 100%; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-radius: var(--small-radius); text-align: left; background: var(--soft); }
    .event-text { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .event-text strong { display: block; }
    .hours { background: var(--green-soft); color: var(--green); }
    .paid { background: var(--blue-soft); color: var(--blue); }
    .unpaid { background: var(--purple-soft); color: var(--purple); }
    .sick { background: var(--red-soft); color: var(--red); }
    .note { background: var(--yellow-soft); color: var(--yellow); }
    .menu-item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 18px 4px; min-height: 56px; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-weight: 600; text-align: left; }
    .menu-item:last-child { border-bottom: 0; }
    .menu-item span { flex: 1; }
    /* 4. Kalendarz, podgląd, dzień i statystyki */
    .home { display: grid; gap: 16px; }
    .calendar-header { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
    .month-label { background: transparent; border: 0; font-size: 1.1rem; font-weight: 700; padding: 10px 0; min-height: 44px; }
    .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; margin: 12px 0; }
    .weekday { text-align: center; padding: 8px 0; font-size: .72rem; color: var(--muted); }
    .date-cell { border: 1px solid transparent; background: transparent; border-radius: var(--small-radius); min-width: 0; min-height: 48px; padding: 5px 1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .date-cell .number { min-width: 25px; border-radius: var(--pill-radius); font-weight: 600; line-height: 1.6; }
    .date-cell.weekend { color: var(--muted); }
    .date-cell.holiday { color: var(--red); }
    .date-cell.outside { opacity: .4; }
    .date-cell.today .number { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; color: var(--blue); }
    .date-cell[aria-pressed="true"] { background: var(--blue-soft); border-color: #a9caff; opacity: 1; }
    .dots { display: flex; gap: 3px; height: 5px; }
    .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; }
    .dot.hours { background: var(--green); } .dot.paid { background: var(--blue); }
    .dot.unpaid { background: var(--purple); } .dot.sick { background: var(--red); } .dot.note { background: #d7a30b; }
    .legend { display: flex; flex-wrap: wrap; gap: 5px 12px; color: var(--muted); font-size: .7rem; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .preview-button { border: 0; padding: 0; background: transparent; text-align: left; width: 100%; }
    .preview-button .preview-body { display: grid; gap: 10px; margin-top: 16px; }
    .preview-note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
    .preview-open { color: var(--blue); font-size: .85rem; font-weight: 600; margin-top: 14px; }
    .templates { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 16px; }
    .templates .row { margin-top: 10px; gap: 8px; }
    .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; margin-top: 18px; }
    .metric strong { display: block; font-size: 1.4rem; letter-spacing: -.04em; overflow-wrap: anywhere; }
    .metric span { color: var(--muted); font-size: .82rem; }
    .day-nav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 10px; align-items: center; text-align: center; }
    .day-nav p { font-weight: 650; }
    .fab { position: fixed; right: max(20px, calc((100vw - 920px) / 2), env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); width: 60px; height: 60px; border: 0; border-radius: 22px; background: var(--blue); color: white; box-shadow: 0 6px 24px #1565d833; }
    .fab svg { width: 28px; height: 28px; }
    .day-screen { padding-bottom: 80px; }
    .template-row { padding: 10px 0; border-bottom: 1px solid var(--line); }
    /* 5. Dialog, dostępność i responsywność */
    dialog { border: 0; border-radius: var(--radius); padding: 24px; background: var(--surface); color: var(--ink); width: min(440px, calc(100% - 32px)); max-height: calc(var(--viewport-height) - 32px); overflow-y: auto; box-shadow: 0 18px 80px #17233d30; }
    dialog::backdrop { background: #17233d65; }
    dialog p { white-space: pre-line; overflow-wrap: anywhere; margin-top: 12px; }
    #toast { position: fixed; z-index: 10; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 14px 20px; border-radius: 20px; background: #263043; color: white; width: max-content; max-width: calc(100% - 32px); box-shadow: var(--shadow); pointer-events: none; }
    body:has(dialog[open]) { overflow: hidden; }
    button { transition: background-color var(--motion), transform var(--motion); }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (hover: hover) and (pointer: fine) { button:hover:not(:disabled) { filter: brightness(.97); } }
    @media (min-width: 720px) { .home { grid-template-columns: 1.15fr 1fr; align-items: start; } .calendar-card { grid-row: span 2; } .date-cell { min-height: 60px; } .form-card { max-width: 640px; margin: auto; width: 100%; } }
    @media (max-width: 359px) { :root { --space: 16px; --gap: 12px; } .calendar { gap: 1px; } .date-cell { border-radius: 10px; } .header { gap: 8px; } .version { display: none; } }
    @media (prefers-reduced-motion: reduce) { :root { --motion: 0ms; } }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <!-- 6. Stała struktura: jeden nagłówek, jeden obszar widoku, jeden dialog -->
  <div class="app">
    <header class="header">
      <button class="icon-button" id="back" type="button" aria-label="Wstecz" hidden></button>
      <h1 id="heading">Czas pracy</h1>
      <span class="version">1.0.0 · wersja testowa</span>
      <button class="icon-button" id="more" type="button" aria-label="Więcej"></button>
    </header>
    <aside id="storage-warning" class="notice error" role="alert" hidden></aside>
    <aside id="backup-reminder" class="notice" hidden>Warto wykonać kopię danych. <button class="pill" type="button" data-action="backup-screen">Kopia i przywracanie</button></aside>
    <main id="screen" tabindex="-1"></main>
    <noscript>Włącz JavaScript, aby używać ewidencji czasu pracy.</noscript>
  </div>
  <dialog id="confirmation" aria-labelledby="confirmation-title">
    <h2 id="confirmation-title"></h2>
    <p id="confirmation-message"></p>
    <div class="actions" id="confirm-actions">
      <button class="button secondary" id="confirm-cancel" type="button">Anuluj</button>
      <button class="button" id="confirm-ok" type="button">Potwierdź</button>
    </div>
  </dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script>
  (() => {
    'use strict';
    // 1. Konfiguracja. Żaden odczyt ani zapis nie dotyka bazy starej aplikacji.
    const CONFIG = Object.freeze({ version: '1.0.0', storageKey: 'worktime_next_v1', backupKey: 'worktime_next_v1_last_backup_iso' });
    const pad2 = n => String(n).padStart(2, '0');
    const round2 = num => Math.round((num + Number.EPSILON) * 100) / 100;
    const clone = value => JSON.parse(JSON.stringify(value));
    const $ = id => document.getElementById(id);
    const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
    const ym = iso => iso.slice(0, 7);
    const isoFromDate = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
    const todayISO = () => isoFromDate(new Date());
    function parseISODate(iso) {
      if (typeof iso !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
      const [y, m, d] = iso.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d ? date : null;
    }
    function moveDay(iso, count) {
      const date = parseISODate(iso);
      if (!date) throw new Error('Nieprawidłowa data.');
      date.setDate(date.getDate() + count);
      return isoFromDate(date);
    }
    function moveMonth(month, count) {
      const [y, m] = month.split('-').map(Number);
      return ym(isoFromDate(new Date(y, m - 1 + count, 1)));
    }
    const fmtMonthPL = month => {
      const label = new Intl.DateTimeFormat('pl-PL', { month: 'long', year: 'numeric' }).format(parseISODate(`${month}-01`));
      return label.charAt(0).toUpperCase() + label.slice(1);
    };
    const DOW_SHORT = ['Nd', 'Pn', 'Wt', 'Śr', 'Czw', 'Pt', 'Sb'];
    const fmtWeekdayPL = iso => DOW_SHORT[parseISODate(iso).getDay()];
    const dateLabel = iso => new Intl.DateTimeFormat('pl-PL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(parseISODate(iso));
    const fmtHM = minutes => `${Math.floor(minutes / 60)}:${pad2(minutes % 60)}`;
    const pln = value => value.toLocaleString('pl-PL', { style: 'currency', currency: 'PLN' });
    const leaveLabel = type => ({ paid: 'Urlop płatny', unpaid: 'Urlop bezpłatny', sick: 'Zwolnienie L4' }[type] || '');
    const escapeHtml = value => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    function normalizeTime(value) {
      const match = typeof value === 'string' && value.trim().match(/^(\d{1,2}):(\d{1,2})$/);
      if (!match || Number(match[1]) > 23 || Number(match[2]) > 59) return '';
      return `${pad2(Number(match[1]))}:${pad2(Number(match[2]))}`;
    }
    // 7. Model kopii JSON, walidacja i przechowywanie
    function emptyDB() {
      return { settings: { rate: 0, leaveQuota: 26, defaultIncludeSat: false, defaultIncludeSun: false,
        defaultIncludeHolidays: false, backupReminderDays: 5,
        shiftTemplates: [{ start: '06:00', end: '15:00' }, { start: '06:00', end: '16:00' }] }, entries: [] };
    }
    function normalizedShift(shift) {
      if (!object(shift)) throw new Error('Nieprawidłowy zakres godzin.');
      const start = normalizeTime(shift.start), end = normalizeTime(shift.end);
      if (!start || !end || start === end) throw new Error('Godziny muszą być poprawne i różne.');
      return { ...shift, start, end };
    }
    function prepareDB(source) {
      if (!object(source) || !object(source.settings) || !Array.isArray(source.entries)) throw new Error('Kopia musi zawierać obiekt settings i tablicę entries.');
      const result = clone(source);
      result.settings = { ...emptyDB().settings, ...result.settings };
      for (const key of ['rate', 'leaveQuota', 'backupReminderDays']) {
        const value = result.settings[key];
        if (!['number', 'string'].includes(typeof value) || String(value).trim() === '') throw new Error(`Nieprawidłowe ustawienie ${key}.`);
        result.settings[key] = Number(value);
        if (!Number.isFinite(result.settings[key]) || result.settings[key] < (key === 'backupReminderDays' ? 1 : 0)) throw new Error(`Nieprawidłowe ustawienie ${key}.`);
      }
      for (const key of ['defaultIncludeSat', 'defaultIncludeSun', 'defaultIncludeHolidays']) {
        if (typeof result.settings[key] !== 'boolean') throw new Error(`Ustawienie ${key} musi mieć wartość true lub false.`);
      }
      if (!Array.isArray(result.settings.shiftTemplates)) throw new Error('Nieprawidłowa lista szablonów.');
      result.settings.shiftTemplates = result.settings.shiftTemplates.map(normalizedShift);
      if (result.settings.lastShift !== undefined) result.settings.lastShift = normalizedShift(result.settings.lastShift);
      for (const day of result.entries) {
        if (!object(day) || !parseISODate(day.date)) throw new Error('Kopia zawiera nieprawidłową datę.');
        if (day.note !== undefined && typeof day.note !== 'string') throw new Error(`Nieprawidłowa notatka ${day.date}.`);
        if (day.vacation !== undefined && typeof day.vacation !== 'boolean') throw new Error(`Nieprawidłowy urlop ${day.date}.`);
        if (day.shifts !== undefined && !Array.isArray(day.shifts)) throw new Error(`Nieprawidłowe godziny ${day.date}.`);
        day.note ??= '';
        // Konwersja starszych wpisów odbywa się przed uzupełnianiem brakujących pól.
        if (day.start !== undefined || day.end !== undefined) {
          const legacy = normalizedShift({ start: day.start, end: day.end });
          if (!day.shifts?.length) day.shifts = [legacy];
          else if (!day.shifts.some(s => normalizeTime(s.start) === legacy.start && normalizeTime(s.end) === legacy.end)) throw new Error(`Niejednoznaczne stare i nowe godziny ${day.date}.`);
          delete day.start;
          delete day.end;
        }
        day.shifts = (day.shifts || []).map(normalizedShift);
        if (day.leaveType == null || (day.leaveType === '' && day.vacation === true)) day.leaveType = day.vacation ? 'paid' : '';
        if (!['', 'paid', 'unpaid', 'sick'].includes(day.leaveType)) throw new Error(`Nieznana absencja ${day.date}: ${day.leaveType}. Import został zatrzymany.`);
        if (day.vacation === true && day.leaveType !== 'paid') throw new Error(`Sprzeczna absencja ${day.date}.`);
        day.vacation = day.leaveType === 'paid';
        for (const shift of day.shifts) if (!shiftAbsRange(day.date, shift.start, shift.end)) throw new Error(`Nieprawidłowa zmiana ${day.date}.`);
      }
      // Nieznane pola są zachowane. Powtórzone daty są rozstrzygane osobno przy imporcie.
      return result;
    }
    function createStore(storage) {
      let raw = null, value = emptyDB(), error = '';
      function load() {
        try {
          raw = storage.getItem(CONFIG.storageKey);
          const incoming = raw === null ? emptyDB() : prepareDB(JSON.parse(raw));
          if (new Set(incoming.entries.map(d => d.date)).size !== incoming.entries.length) throw new Error('Baza zawiera powtórzone daty. Pobierz surową kopię i użyj importu.');
          value = incoming;
          error = '';
        } catch (exception) { error = exception.message; }
        return value;
      }
      load();
      return {
        get db() { return value; }, get error() { return error; }, get raw() { return raw; }, reload: load,
        commit(next) {
          if (error) throw new Error('Zapis zablokowany po błędzie odczytu. Zachowaj surową kopię danych.');
          if (storage.getItem(CONFIG.storageKey) !== raw) throw new Error('Dane zmieniły się w innej karcie. Odśwież aplikację przed zapisem.');
          const prepared = prepareDB(next);
          if (new Set(prepared.entries.map(d => d.date)).size !== prepared.entries.length) throw new Error('Powtórzone daty w bazie.');
          const serialized = JSON.stringify(prepared);
          storage.setItem(CONFIG.storageKey, serialized);
          value = prepared;
          raw = serialized;
        }
      };
    }
    // 8. Wspólne obliczenia czasu, konfliktów, świąt i statystyk
    function shiftAbsRange(iso, start, end) {
      const date = parseISODate(iso);
      start = normalizeTime(start); end = normalizeTime(end);
      if (!date || !start || !end || start === end) return null;
      const [sh, sm] = start.split(':').map(Number), [eh, em] = end.split(':').map(Number);
      const a = new Date(date.getFullYear(), date.getMonth(), date.getDate(), sh, sm).getTime();
      let b = new Date(date.getFullYear(), date.getMonth(), date.getDate(), eh, em).getTime();
      if (b < a) b = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 1, eh, em).getTime();
      return b > a ? { startMs: a, endMs: b } : null;
    }
    function minutesBetween(iso, start, end) {
      const range = shiftAbsRange(iso, start, end);
      return range ? Math.round((range.endMs - range.startMs) / 60000) : 0;
    }
    const computeDayMinutes = day => (day?.shifts || []).reduce((sum, shift) => sum + minutesBetween(day.date, shift.start, shift.end), 0);
    function validateShift(database, iso, start, end, skipIndex = -1) {
      const candidate = shiftAbsRange(iso, start, end);
      if (!candidate) throw new Error('Podaj poprawne i różne godziny wejścia i wyjścia.');
      const relevant = new Set([moveDay(iso, -1), iso, moveDay(iso, 1)]);
      for (const day of database.entries) {
        if (!relevant.has(day.date)) continue;
        day.shifts.forEach((shift, index) => {
          if (day.date === iso && index === skipIndex) return;
          const range = shiftAbsRange(day.date, shift.start, shift.end);
          if (range && Math.max(range.startMs, candidate.startMs) < Math.min(range.endMs, candidate.endMs)) throw new Error(`Konflikt z ${day.date}: ${shift.start}–${shift.end}. Zakresy stykające się są dozwolone.`);
        });
      }
    }
    function easterSunday(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      return new Date(year, Math.floor((h + l - 7 * m + 114) / 31) - 1, (h + l - 7 * m + 114) % 31 + 1);
    }
    const holidayCache = new Map();
    function holidays(year) {
      if (holidayCache.has(year)) return holidayCache.get(year);
      const result = new Map([
        ['01-01', 'Nowy Rok'], ['01-06', 'Święto Trzech Króli'], ['05-01', 'Święto Pracy'], ['05-03', 'Święto Konstytucji 3 Maja'],

        tools: () => `<section class="card form-card stack"><h2>Wyczyść miesiąc</h2>${inputField('clear-month', 'Miesiąc', 'month', month, 'id="clear-month" required min="0100-01" max="9998-12"')}<p class="muted">Usuwa godziny, absencje i notatki wyłącznie z wybranego miesiąca. Najpierw pobierz kopię JSON.</p><button class="button danger" type="button" data-action="clear-month">Wyczyść miesiąc</button></section>`,
        about: () => `<section class="card form-card stack"><h2>Czas pracy ${CONFIG.version}</h2><p>Lokalna ewidencja czasu pracy. Dane pozostają w tej przeglądarce; aplikacja nie używa kont ani chmury.</p><p class="muted">Nowy interfejs inspirowany ergonomią One UI. Wersja testowa korzysta z oddzielnej bazy. Instalacja PWA, aktualizacje i pełna praca offline wymagają późniejszego manifestu oraz Service Workera.</p></section>`
      }[route.view];
      $('screen').innerHTML = markup();
      formSnapshot = formValue();
      if (route.view !== 'backup') pendingImport = null;
      else renderImportPlan();
      showStorageWarning();
      if (focus) { window.scrollTo(0, 0); $('screen').focus({ preventScroll: true }); }
    }
    function formValue() {
      const form = $('editor') || $('settings-form');
      return form ? JSON.stringify([...new FormData(form)]) : '';
    }
    const dirty = () => formValue() !== formSnapshot;
    const historyState = () => ({ worktimeNext: true, sequence, route: clone(route) });
    function syncHistory() { history.replaceState(historyState(), ''); }
    function go(next) {
      route = next; sequence++;
      history.pushState(historyState(), '');
      render(true);
    }
    function back() {
      if (sequence > 0) history.back();
      else { route = { view: 'home' }; syncHistory(); render(true); }
    }
    function replaceRoute(next) { route = next; syncHistory(); render(); }
    function closeDialog(answer) {
      if (!dialogResolve) return;
      const resolve = dialogResolve; dialogResolve = null;
      if ($('confirmation').open) $('confirmation').close();
      resolve(answer);
    }
    function confirmAction(heading, message, accept = 'Potwierdź') {
      if (dialogResolve) return Promise.resolve(false);
      $('confirmation-title').textContent = heading;
      $('confirmation-message').textContent = message;
      $('confirm-actions').innerHTML = `<button class="button secondary" id="confirm-cancel" type="button">Anuluj</button><button class="button" id="confirm-ok" type="button">${escapeHtml(accept)}</button>`;
      dialogAnswer = false;
      dialogClosing = false;
      $('confirmation').showModal();
      history.pushState({ ...historyState(), overlay: true }, '');
      return new Promise(resolve => { dialogResolve = resolve; });
    }
    function answerDialog(answer) {
      if (!dialogResolve || dialogClosing) return;
      // Promise rozwiązuje się dopiero po zdjęciu stanu dialogu z historii.
      dialogClosing = true;
      dialogAnswer = answer;
      history.back();
    }
    function chooseEvent() {
      const promise = confirmAction('Dodaj wydarzenie', 'Wybierz rodzaj wpisu.');
      $('confirm-actions').innerHTML = `<div class="stack" style="width:100%">${[['hours', 'clock', 'Dodaj godziny'], ['leave', 'calendar', 'Dodaj urlop / L4'], ['note', 'note', 'Dodaj notatkę']].map(([kind, name, label]) => `<button type="button" class="menu-item" data-dialog-kind="${kind}">${icon(name)}<span>${label}</span></button>`).join('')}<button type="button" class="button secondary" id="confirm-cancel">Anuluj</button></div>`;
      $('confirm-actions').querySelector('button').focus();
      return promise;
    }
    window.addEventListener('popstate', event => {
      const target = event.state;
      if (dialogResolve) { closeDialog(dialogAnswer); return; }
      if (historyTarget) {
        if (!target?.worktimeNext || target.sequence !== historyTarget.sequence) return;
        const action = historyTarget.action; historyTarget = null; action(); return;
      }
      if (dirty()) {
        const current = historyState();
        const targetSequence = target?.worktimeNext ? target.sequence : 0;
        const delta = current.sequence - targetSequence || 1;
        historyTarget = { sequence: current.sequence, action: async () => {
          if (await confirmAction('Odrzucić zmiany?', 'Niezapisane zmiany formularza zostaną odrzucone.', 'Odrzuć')) {
            formSnapshot = formValue(); history.go(-delta);
          }
        } };
        history.go(delta); return;
      }
      if (target?.worktimeNext) { sequence = target.sequence; route = target.route; }
      else { sequence = 0; route = { view: 'home' }; }
      render(true);
    });
    async function deleteEvent() {
      if (!await confirmAction('Usunąć wydarzenie?', 'Pozostałe godziny, absencja i notatka zostaną zachowane.', 'Usuń')) return;
      mutate(next => {
        const day = dayIn(next, selected);
        if (route.kind === 'hours') day.shifts.splice(route.index, 1);
        if (route.kind === 'leave') setLeave(next, selected, '');
        if (route.kind === 'note') day.note = '';
      });
      formSnapshot = formValue(); back(); notify('Wydarzenie usunięte.');
    }
    async function importCommit(replace) {
      if (!pendingImport) return;
      const candidate = replace ? pendingImport.db : planMerge(db, pendingImport.db).db;
      const message = replace ? 'Wszystkie obecne wpisy i ustawienia zostaną zastąpione kopią. Najpierw pobierz kopię obecnej bazy. Tej operacji nie można cofnąć bez kopii.' : 'Zostaną dodane nowe godziny i uzupełnione puste notatki oraz absencje. Obecne ustawienia pozostaną. Różnice widoczne w podglądzie nie zostaną nadpisane.';
      if (!await confirmAction(replace ? 'Zastąpić całą bazę?' : 'Scalić dane?', message, replace ? 'Zastąp bazę' : 'Scal')) return;
      commit(candidate); pendingImport = null; render(); notify('Dane z kopii zapisane.');
    }
    async function action(name) {
      switch (name) {
        case 'more': go({ view: 'menu' }); break;
        case 'back': back(); break;
        case 'open-day': go({ view: 'day' }); break;
        case 'prev-month': case 'next-month': {
          month = moveMonth(month, name === 'prev-month' ? -1 : 1);
          const [y, m] = month.split('-').map(Number);
          selected = `${month}-${pad2(Math.min(Number(selected.slice(-2)), new Date(y, m, 0).getDate()))}`;
          refreshHome(); break;
        }
        case 'today': selected = todayISO(); month = ym(selected); refreshHome(); break;
        case 'month-picker': go({ view: 'form', kind: 'month' }); break;
        case 'prev-day': case 'next-day': selected = moveDay(selected, name === 'prev-day' ? -1 : 1); month = ym(selected); render(); break;
        case 'hours': go({ view: 'form', kind: 'hours', index: -1 }); break;
        case 'leave': case 'note': go({ view: 'form', kind: name }); break;
        case 'fab': { const kind = await chooseEvent(); if (kind) go({ view: 'form', kind, index: -1 }); break; }
        case 'bulk': go({ view: 'form', kind: 'bulk' }); break;
        case 'settings': go({ view: 'settings' }); break;
        case 'tools': go({ view: 'tools' }); break;
        case 'about': go({ view: 'about' }); break;
        case 'backup-screen': go({ view: 'backup' }); break;
        case 'stats': go({ view: 'stats', mode: 'month', month }); break;
        case 'stats-month': replaceRoute({ view: 'stats', mode: 'month', month: route.month || month }); break;
        case 'stats-year': replaceRoute({ view: 'stats', mode: 'year', year: Number((route.month || month).slice(0, 4)) }); break;
        case 'bulk-hours': case 'bulk-leave': {
          const hours = name === 'bulk-hours', form = $('editor'); form.elements.mode.value = hours ? 'hours' : 'leave';
          $('bulk-hours').hidden = !hours; $('bulk-leave').hidden = hours;
          form.elements.start.required = hours; form.elements.end.required = hours;
          form.elements.start.disabled = !hours; form.elements.end.disabled = !hours;
          form.elements.leaveType.disabled = hours;
          document.querySelectorAll('[data-action^="bulk-"]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.action === name)));
          break;
        }
        case 'delete-event': await deleteEvent(); break;
        case 'export': exportJSON(); break;
        case 'raw-export': download(`czas-pracy-surowe_${todayISO()}.json`, store.raw || ''); notify('Zlecono pobranie surowych danych. Sprawdź pobrane pliki.'); break;
        case 'import-merge': await importCommit(false); break;
        case 'import-replace': await importCommit(true); break;
        case 'import-cancel': pendingImport = null; $('import-plan').innerHTML = ''; $('import-file').value = ''; break;
        case 'report': await openReport(); break;
        case 'clear-month': {
          const period = $('clear-month').value;
          if (!parseISODate(`${period}-01`)) throw new Error('Wybierz poprawny miesiąc.');
          const count = db.entries.filter(d => ym(d.date) === period).length;
          if (!await confirmAction('Wyczyścić miesiąc?', `${fmtMonthPL(period)}\nLiczba wpisów dni: ${count}.\nZostaną usunięte wszystkie godziny, absencje i notatki z tego miesiąca.`, 'Wyczyść')) return;
          mutate(next => { next.entries = next.entries.filter(d => ym(d.date) !== period); }); notify('Wybrany miesiąc wyczyszczony.'); break;
        }
      }
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      if (button.dataset.dialogKind) { answerDialog(button.dataset.dialogKind); return; }
      if (button.id === 'confirm-ok') { answerDialog(true); return; }
      if (button.id === 'confirm-cancel') { answerDialog(false); return; }
      (async () => {
        if (button.dataset.date) {
          const oldMonth = month; selected = button.dataset.date; month = ym(selected);
          if (oldMonth !== month) refreshHome();
          else { document.querySelectorAll('[data-date]').forEach(cell => cell.setAttribute('aria-pressed', String(cell.dataset.date === selected))); $('preview-card').innerHTML = previewMarkup(); }
        } else if (button.dataset.template !== undefined) {
          const template = db.settings.shiftTemplates[Number(button.dataset.template)];
          mutate(next => setShift(next, selected, template.start, template.end));
          if (route.view === 'home') refreshHome(); else render(); notify('Godziny dodane.');
        } else if (button.dataset.shift !== undefined) go({ view: 'form', kind: 'hours', index: Number(button.dataset.shift) });
        else if (button.dataset.removeTemplate !== undefined) {
          if (dirty()) throw new Error('Najpierw zapisz zmiany ustawień.');
          mutate(next => next.settings.shiftTemplates.splice(Number(button.dataset.removeTemplate), 1)); render();
        } else await action(button.dataset.action || button.id);
      })().catch(error => notify(error.message));
    });
    $('confirmation').addEventListener('cancel', event => { event.preventDefault(); answerDialog(false); });
    document.addEventListener('submit', event => {
      event.preventDefault();
      const form = event.target;
      (async () => {
        const data = new FormData(form), value = name => data.get(name);
        if (form.id === 'settings-form') {
          mutate(next => {
            for (const name of ['rate', 'leaveQuota', 'backupReminderDays']) next.settings[name] = Number(value(name));
            for (const name of ['defaultIncludeSat', 'defaultIncludeSun', 'defaultIncludeHolidays']) next.settings[name] = data.has(name);
          });
          formSnapshot = formValue(); notify('Ustawienia zapisane.'); return;
        }
        if (form.id === 'template-form') {
          if (dirty()) throw new Error('Najpierw zapisz zmiany ustawień.');
          const shift = normalizedShift({ start: value('start'), end: value('end') });
          if (db.settings.shiftTemplates.length >= 8) throw new Error('Możesz mieć maksymalnie osiem szablonów.');
          if (db.settings.shiftTemplates.some(t => t.start === shift.start && t.end === shift.end)) throw new Error('Ten szablon już istnieje.');
          mutate(next => next.settings.shiftTemplates.push(shift)); render(); return;
        }
        if (form.id !== 'editor') return;
        if (route.kind === 'month') {
          const nextMonth = value('month');
          if (!parseISODate(`${nextMonth}-01`)) throw new Error('Wybierz poprawny miesiąc.');
          month = nextMonth; selected = `${month}-01`;
        } else if (route.kind === 'bulk') {
          const spec = { from: value('from'), to: value('to'), operation: `${value('mode')}-${event.submitter?.value || 'add'}`,
            start: value('start'), end: value('end'), leaveType: value('leaveType'), includeSat: data.has('includeSat'), includeSun: data.has('includeSun'), includeHolidays: data.has('includeHolidays') };
          const plan = planBulk(db, spec);
          if (!await confirmAction('Potwierdź wpisy zbiorcze', `Zakres: ${spec.from} – ${spec.to}\nDni do zmiany: ${plan.changed}\nPominięte weekendy / święta: ${plan.skipped}\nPominięte konflikty godzin: ${plan.conflicts}\n${spec.operation.endsWith('remove') ? 'Usunięcie obejmuje wyłącznie wskazane godziny lub statusy.' : 'Istniejące godziny i notatki zostaną zachowane. Przy dodaniu absencji jej status w wybranych dniach zostanie zastąpiony.'}`, 'Zastosuj')) return;
          commit(plan.db);
        } else mutate(next => {
          if (route.kind === 'hours') setShift(next, selected, value('start'), value('end'), route.index);
          if (route.kind === 'leave') setLeave(next, selected, value('leaveType'));
          if (route.kind === 'note') ensureDay(next, selected).note = value('note');
        });
        formSnapshot = formValue(); back(); notify('Zapisano.');
      })().catch(error => {
        const output = form.id === 'template-form' ? $('template-error') : $('form-error');
        if (output) { output.textContent = error.message; output.hidden = false; } else notify(error.message);
      });
    });
    document.addEventListener('change', event => {
      const input = event.target;
      if (input.id === 'stats-month' && parseISODate(`${input.value}-01`)) replaceRoute({ ...route, month: input.value });
      if (input.id === 'stats-year' && input.validity.valid && input.value) replaceRoute({ ...route, year: Number(input.value) });
      if (input.id === 'report-month') { route.reportMonth = input.value; syncHistory(); }
      if (input.id === 'import-file') {
        const file = input.files[0]; pendingImport = null; $('import-plan').innerHTML = '';
        $('import-plan').classList.remove('error-text');
        if (!file) return;
        file.text().then(text => {
          if (route.view !== 'backup' || $('import-file') !== input || input.files[0] !== file) return;
          pendingImport = prepareImport(JSON.parse(text.replace(/^\uFEFF/, ''))); renderImportPlan();
        }).catch(error => {
          if (route.view !== 'backup') return;
          pendingImport = null; $('import-plan').textContent = `Import zatrzymany: ${error.message}`;
          $('import-plan').classList.add('error-text');
        });
      }
    });
    // 17. Inicjalizacja bez zapisu bazy i bez rejestrowania Service Workera.
    $('back').innerHTML = icon('back'); $('more').innerHTML = icon('more');
    history.replaceState(historyState(), '');
    window.addEventListener('beforeunload', event => { if (dirty()) { event.preventDefault(); event.returnValue = ''; } });
    window.addEventListener('storage', event => {
      if (event.key !== CONFIG.storageKey) return;
      if (route.view === 'form' || route.view === 'settings' || dialogResolve || pendingImport) { notify('Dane zmieniły się w innej karcie. Zapis wymaga odświeżenia; najpierw zachowaj treść formularza.'); return; }
      db = store.reload(); render(); updateReminder();
    });
    function updateViewport() {
      if (!window.visualViewport) return;
      document.documentElement.style.setProperty('--viewport-height', `${window.visualViewport.height}px`);
      const field = document.activeElement;
      if (field?.matches('input,textarea,select')) field.scrollIntoView({ block: 'nearest' });
    }
    window.visualViewport?.addEventListener('resize', updateViewport);
    updateViewport(); render(); updateReminder();
  })();
  </script>
</body>
</html>
